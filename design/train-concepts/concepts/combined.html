<title>Train Portfolio Concepts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,400;0,500;0,700;0,800;0,900;1,400&family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:ital,wght@0,400;0,500;0,700;1,400&family=Pixelify+Sans:wght@400;500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root { --page: #1F1612; }
body { background: var(--page); }
.concept { min-height: 100vh; }
{{ css|safe }}
</style>

{% for cid in ["a", "b", "c"] %}
<div class="concept" data-concept="{{ cid }}"{% if cid != "a" %} hidden{% endif %}>
{% set px = cid ~ "-" %}{% set combined = true %}{% include cid ~ "/body.html" %}
</div>
{% endfor %}

<script>
(function () {
  const NAMES = { a: 'interchange', b: 'diorama', c: 'pixel-depot' };
  const BY_NAME = Object.fromEntries(Object.entries(NAMES).map(([k, v]) => [v, k]));
  const dds = [...document.querySelectorAll('.dd')];
  function show(id, fromUser) {
    document.querySelectorAll('.concept').forEach(el => { el.hidden = el.dataset.concept !== id; });
    try { localStorage.setItem('rail-concept', id); } catch (e) {}
    if (fromUser) {
      if (location.hash !== '#' + NAMES[id]) history.replaceState(null, '', '#' + NAMES[id]);
      window.scrollTo(0, 0);
      const btn = document.querySelector(`[data-concept="${id}"] .dd__btn`); if (btn) btn.focus({ preventScroll: true });
    }
  }
  dds.forEach(dd => {
    const btn = dd.querySelector('.dd__btn'), list = dd.querySelector('.dd__list'), opts = [...list.querySelectorAll('[role="option"]')];
    const open = () => { list.hidden = false; btn.setAttribute('aria-expanded', 'true'); (opts.find(o => o.getAttribute('aria-selected') === 'true') || opts[0]).focus(); };
    const close = focusBtn => { list.hidden = true; btn.setAttribute('aria-expanded', 'false'); if (focusBtn) btn.focus(); };
    const pick = o => { close(false); show(o.dataset.conceptBtn, true); };
    btn.addEventListener('click', () => (list.hidden ? open() : close(false)));
    btn.addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); open(); } });
    opts.forEach((o, i) => {
      o.addEventListener('click', () => pick(o));
      o.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); opts[(i + 1) % opts.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); opts[(i + opts.length - 1) % opts.length].focus(); }
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(o); }
        else if (e.key === 'Escape' || e.key === 'Tab') close(e.key === 'Escape');
      });
    });
    document.addEventListener('click', e => { if (!list.hidden && !dd.contains(e.target)) close(false); });
  });
  let start = BY_NAME[location.hash.slice(1)];
  if (!start) { try { start = localStorage.getItem('rail-concept'); } catch (e) {} }
  show(NAMES[start] ? start : 'a', false);
  addEventListener('hashchange', () => { const id = BY_NAME[location.hash.slice(1)]; if (id) show(id, false); });
})();
</script>
<script>{{ engine|safe }}</script>
{% for js in renders %}<script>{{ js|safe }}</script>
{% endfor %}
