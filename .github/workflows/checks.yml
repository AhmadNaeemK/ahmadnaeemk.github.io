name: Checks

on:
  pull_request:
  push:
    branches: [main, redesign/astro, "ahmad/wave-*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage

  e2e:
    name: e2e ${{ matrix.shard }} of 2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install Playwright browsers
        run: npm run test:e2e:install -- --with-deps

      - name: Run e2e tests against the built site
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2 --workers=2

      - name: Upload Playwright report and failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # The one required check. `always()` keeps it from counting as skipped, which GitHub
  # treats as passing, when a job it needs fails.
  checks:
    name: checks
    if: always()
    needs: [static, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$STATIC_RESULT" = success && test "$E2E_RESULT" = success
