name: Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue instead of cancelling, so one in progress always finishes and the
# newest push is the last one published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    # A hand-run from another branch must never publish. `deploy` is skipped through `needs`.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # withastro/action takes a Node version but not a version file.
      - name: Read Node version from .nvmrc
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Build the site and upload it for Pages
        uses: withastro/action@v6
        with:
          node-version: ${{ steps.node.outputs.version }}

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    # Only this job can publish. `build` runs `npm install`, whose lifecycle scripts
    # shouldn't be able to request an OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
